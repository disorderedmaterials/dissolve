name: Test MSVC (Visual Studio 2022) Developer Build

on:
  workflow_call:
    inputs:
      qtVersion:
        type: string
        required: true
      antlrVersion:
        type: string
        required: true
      changedFiles:
        type: string
        required: true

jobs:

  MsvcDev:
    strategy:
      fail-fast: false
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: "Develop MSVC"
        uses: "./.github/workflows/visual-studio"
        with:
          changedFiles: ${{ inputs.changed_files }}
          qtVersion: ${{ inputs.qtVersion }}
          antlrVersion: ${{ inputs.antlrVersion }}