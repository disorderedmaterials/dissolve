name: Continuous

on:
  push:
    branches:
    - 'develop'
    paths-ignore:
    - '.github/workflows/benchmark.yml'
    - '.github/workflows/cacheConan.yml'
    - '.github/workflows/cacheNix.yml'
    - '.github/workflows/issues.yml'
    - '.github/workflows/pr.yml'
    - '.github/workflows/release.yml'
    - '.github/workflows/web**'
    - '.github/ISSUE_TEMPLATE/**'
    - 'web/**'
    - 'README.md'

jobs:

  Checkout:
    uses: "./.github/workflows/_checkout.yml"
    with:
      bump: true

  BuildAndPackage:
    needs: [Checkout]
    uses: "./.github/workflows/_build_and_package.yml"

  Publish:
    needs: [BuildAndPackage]
    uses: "./.github/workflows/_publishing.yml"
    with:
      publishType: 'continuous'
      releaseTag: ${{ needs.Checkout.outputs.currentVersion }}
      releaseName: "Release ${{ needs.Checkout.outputs.currentVersion }}"
      releaseBody: ${{ github.event.pull_request.body }}
    secrets: inherit
