name: Build
description: Build on Linux via nix

inputs:
  target:
    default: "dissolve"
  cacheOnly:
    type: boolean
    default: false
  currentVersion:
    type: string
  nixHash:
    type: string
    required: true
  benchmark:
    type: boolean
    default: false
  publishBenchmarks:
    type: boolean
    default: false

runs:
  using: "composite"
  steps:

  - name: Free Up Space
    uses: "./.github/workflows/linux-free-up-space"

  - name: Install nix
    uses: "./.github/workflows/get-nix"
    with:
      target: ${{ inputs.target }}

  - name: Cache Nix Store
    uses: actions/cache@v4
    id: nix-cache
    with:
      path: /tmp/nixcache
      key: ${{ runner.os }}-${{ inputs.nixHash }}-nix-cache

  - name: Import Nix Store Cache
    if: steps.nix-cache.outputs.cache-hit == 'true'
    shell: bash
    run: |
      nix-store --import < /tmp/nixcache
      sudo rm -rf /tmp/nixcache

  - name: Build
    shell: bash
    run: |
      set -ex

      git submodule update --init --recursive

      # Build Singularity target
      target=${{ inputs.target }}
      singularityTarget=${target/dissolve/singularity}
      nix build -L ".#$singularityTarget"

      # Assemble artifacts
      mkdir packages-sif
      cp -v result packages-sif/${{ inputs.target }}-${{ inputs.currentVersion }}.sif

  - name: Bundle Executable
    shell: bash
    run: |
      set -ex

      nix bundle -L .#${{ inputs.target }} -o binary

      # Assemble artifacts
      mkdir packages-binary
      cp -v binary packages-binary/${{ inputs.target }}-${{ inputs.currentVersion }}

  # - name: Run benchmarks
  #   if: inputs.benchmark == 'true'
  #   shell: bash
  #   run: |
  #     set -ex
  #     export LD_LIBRARY_PATH=`pwd`/build/onetbb/lib

  #     nix build -L .#benchmarks
  #     rm result
  #     nix run -L .#benchmarks > all_benchmark_results.json

  #     cat all_benchmark_results.json

      # Must reset to HEAD here otherwise the benchmark publishing step will (rightly) fail
      # git reset HEAD --hard

  # - name: Store benchmark result
  #   uses: benchmark-action/github-action-benchmark@v1
  #   if: inputs.publishBenchmarks == 'true' && inputs.benchmark == 'true'
  #   with:
  #     tool: 'googlecpp'
  #     output-file-path: all_benchmark_results.json
  #     github-token: ${{ github.token }}
  #     auto-push: true
  #     comment-on-alert: true
  #     alert-threshold: '200%'
  #     alert-comment-cc-users: '@disorderedmaterials/dissolve-devs'

  - name: Tidy nix Store
    if: inputs.cacheOnly == 'true'
    shell: bash
    run: |
      set -ex
      # Remove the built dissolve derivations / img from the nix store to save space and leave just the other core build deps
      # Need to do this via sudo so we can use --ignore-liveness
      nixStoreCmd=`which nix-store`
      targets=`nix path-info --all | grep dissolve`
      echo "for a in \"$targets\"; do $nixStoreCmd -q --referrers-closure \$a | xargs $nixStoreCmd --delete --ignore-liveness $b; done" | sudo bash

  - name: Export Nix Store Cache
    if: inputs.cacheOnly == 'true'
    shell: bash
    run: nix-store --export $(find /nix/store -maxdepth 1 -name '*-*') > /tmp/nixcache

  - name: Upload Package Artifacts (Binary)
    if: ${{ inputs.cacheOnly == 'false' }}
    uses: actions/upload-artifact@v4
    with:
      name: packages-nix-${{ inputs.target }}-binary
      path: ${{ github.workspace }}/packages-binary

  - name: Upload Package Artifacts (sif)
    if: ${{ inputs.cacheOnly == 'false' }}
    uses: actions/upload-artifact@v4
    with:
      name: packages-nix-${{ inputs.target }}-sif
      path: ${{ github.workspace }}/packages-sif
