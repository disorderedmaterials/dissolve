name: Build
description: Build on Windows

inputs:
  threading:
    default: true
  freeTypeArchive:
    default: https://download.savannah.gnu.org/releases/freetype/freetype-2.12.1.tar.gz
  ftglRepo:
    default: https://github.com/disorderedmaterials/ftgl-2.4.0
  cacheOnly:
    type: boolean
    default: false
  qtVersion:
    type: string
    required: true
  antlrVersion:
    type: string
    required: true
  conanHash:
    type: string
    required: true

runs:
  using: "composite"
  steps:

  #
  # Setup / Install Dependencies
  #

  - uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Setup cmake
    uses: jwlawson/actions-setup-cmake@v2
    with:
      cmake-version: '3.x'

  - name: Install Chocolatey Dependencies
    shell: bash
    run: choco install -y wget

  - name: Install Python Dependencies
    shell: bash
    run: pip3 install py7zr==1.1.0 aqtinstall conan

  #
  # Install Qt
  #

  - name: Install Qt
    shell: bash
    run: |
      aqt install-qt --outputdir ${RUNNER_TEMP}/qt windows desktop ${{ inputs.qtVersion }} win64_msvc2019_64 -m all

  - name: Setup MSVC Compiler
    uses: ilammy/msvc-dev-cmd@v1

  #
  # Build / Retrieve Freetype
  #

  - name: Retrieve FreeType Cache
    id: cache-freetype
    uses: actions/cache@v4
    with:
      key: windows-freetype
      path: |
        ${{ runner.temp }}\freetype-latest
        ${{ runner.temp }}\freetype-install

  - name: Download FreeType
    if: ${{ steps.cache-freetype.outputs.cache-hit != 'true' }}
    working-directory: ${{ runner.temp }}
    shell: bash
    run: |
      set -ex
      wget ${{ inputs.freeTypeArchive }} -Ofreetype.tgz
      tar -zxvf freetype.tgz
      rm freetype.tgz
      mv freetype-* freetype-latest

  - name: Build FreeType
    if: ${{ steps.cache-freetype.outputs.cache-hit != 'true' }}
    working-directory: ${{ runner.temp }}
    shell: bash
    run: |
      set -ex
      mkdir freetype-build && cd freetype-build
      cmake ../freetype-latest -G Ninja -DCMAKE_BUILD_TYPE:STRING="Release" -DCMAKE_C_COMPILER=cl -DBUILD_SHARED_LIBS:STRING=ON -DCMAKE_DISABLE_FIND_PACKAGE_HarfBuzz:bool=true -DCMAKE_DISABLE_FIND_PACKAGE_BZip2:bool=true -DCMAKE_DISABLE_FIND_PACKAGE_PNG:bool=true -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB:bool=true -DCMAKE_DISABLE_FIND_PACKAGE_BrotliDec:bool=true -DCMAKE_INSTALL_PREFIX:path=../freetype-install
      cmake --build . --target install --config Release

  #
  # Build / Retrieve FTGL
  #

  - name: Retrieve FTGL Cache
    id: cache-ftgl
    uses: actions/cache@v4
    with:
      key: windows-ftgl
      path: |
        ${{ runner.temp }}\ftgl-latest
        ${{ runner.temp }}\ftgl-install

  - name: Download FTGL
    if: ${{ steps.cache-ftgl.outputs.cache-hit != 'true' }}
    working-directory: ${{ runner.temp }}
    shell: bash
    run: |
      set -ex
      git clone ${{ inputs.ftglRepo }} ftgl-latest

  - name: Build FTGL
    if: ${{ steps.cache-ftgl.outputs.cache-hit != 'true' }}
    working-directory: ${{ runner.temp }}
    shell: bash
    run: |
      set -ex
      mkdir ftgl-build && cd ftgl-build
      INCLUDE="${RUNNER_TEMP}\freetype-latest;$INCLUDE"
      LIB="${RUNNER_TEMP}\freetype-install\lib;${RUNNER_TEMP}\freetype-install\bin;$LIB"
      cmake ../ftgl-latest -G Ninja -DCMAKE_BUILD_TYPE:STRING="Release" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_INSTALL_PREFIX:path=../ftgl-install
      cmake --build . --target install --config Release

  - name: Get ANTLR and Java
    working-directory: ${{ runner.temp }}
    shell: bash
    run: |
      set -ex
      wget https://www.antlr.org/download/antlr-${{ inputs.antlrVersion }}-complete.jar -Oantlr-${{ inputs.antlrVersion }}-complete.jar
      wget https://download.oracle.com/java/21/latest/jdk-21_windows-x64_bin.zip -Ojava.zip
      unzip java.zip
      
  #
  # Main Build
  #

  - name: Retrieve Conan Cache
    id: cache-conan
    uses: actions/cache@v4
    with:
      key: windows-conan-${{ inputs.conanHash }}
      path: |
        ~\.conan
        ~\.conancache

  - name: Setup Conan Profile
    if: ${{ steps.cache-conan.outputs.cache-hit != 'true' }}
    shell: bash
    run: |
      conan profile detect

  - name: Build
    if: ${{ inputs.cacheOnly == 'false' }}
    shell: bash
    run: |
      git submodule update --init --recursive
      # Setup environment
      Qt6_DIR="${RUNNER_TEMP}\qt\${{ inputs.qtVersion }}\msvc2019_64"
      ANTLR_EXE="${RUNNER_TEMP}\antlr-${{ inputs.antlrVersion }}-complete.jar"
      export PATH="${Qt6_DIR}\bin;$PATH"
      INCLUDE="${RUNNER_TEMP}\freetype-latest;$INCLUDE"
      LIB="${RUNNER_TEMP}\freetype-install\lib;${RUNNER_TEMP}\freetype-install\bin;$LIB"
      INCLUDE="${RUNNER_TEMP}\ftgl-latest\src;$INCLUDE"
      LIB="${RUNNER_TEMP}\ftgl-install\lib;$LIB"
      JAVA_EXE="${JAVA_HOME_21_X64}\bin\java.exe"

      # Build
      mkdir -p build && cd build
      TEMPD=$(mktemp -d)
      mkdir -p $TEMPD/bin
      cmake ../ -G Ninja -DCMAKE_BUILD_TYPE:STRING="Release" -DCMAKE_C_COMPILER=cl -DANTLR_EXECUTABLE:string=$ANTLR_EXE -DJava_JAVA_EXECUTABLE:string=$JAVA_EXE -DCMAKE_CXX_COMPILER=cl -DMULTI_THREADING:bool=${{ inputs.threading }} -DGUI:bool=true -DCMAKE_INSTALL_PREFIX:PATH=$TEMPD
      cmake --build . --config Release
      cp bin/* $TEMPD/bin
      ninja install
      mkdir -p install
      cp -r $TEMPD/* install/

  - name: Test
    if: ${{ inputs.cacheOnly == 'false' }}
    shell: bash
    run: |
      Qt6_DIR="${RUNNER_TEMP}\qt\${{ inputs.qtVersion }}\msvc2019_64"
      ANTLR_EXE="${RUNNER_TEMP}\antlr-${{ inputs.antlrVersion }}-complete.jar"
      export PATH="${Qt6_DIR}\bin;$PATH"
      INCLUDE="${RUNNER_TEMP}\freetype-latest;$INCLUDE"
      LIB="${RUNNER_TEMP}\freetype-install\lib;${RUNNER_TEMP}\freetype-install\bin;$LIB"
      INCLUDE="${RUNNER_TEMP}\ftgl-latest\src;$INCLUDE"
      LIB="${RUNNER_TEMP}\ftgl-install\lib;$LIB"
      JAVA_EXE="${JAVA_HOME_21_X64}\bin\java.exe"
      cd build

      # Run windeployqt on the main Dissolve-GUI-QML binary to pull in Qt library requirements
      ${Qt6_DIR}/bin/windeployqt.exe bin/Dissolve-GUI-QML.exe

      # Assemble external library requirements
      export DEPLOY_DIR="${GITHUB_WORKSPACE}\build"
      export FREETYPE_DIR="${RUNNER_TEMP}\freetype-install\bin"
      export FTGL_DIR="${RUNNER_TEMP}\ftgl-install\bin"
      #cp -v ${DEPLOY_DIR}/install/bin/* ./bin
      cp -v ${FREETYPE_DIR}/freetype.dll ./bin
      cp -v ${FTGL_DIR}/ftgl.dll ./bin
      cp -v ${DEPLOY_DIR}/direct_deploy/onetbb/bin/tbb12.dll ./bin
      cp -v ${DEPLOY_DIR}/direct_deploy/onetbb/bin/tbbmalloc.dll ./bin
      cp -v ${DEPLOY_DIR}/direct_deploy/onetbb/bin/tbbmalloc_proxy.dll ./bin
      cp -v ${DEPLOY_DIR}/direct_deploy/onetbb/bin/tbbbind_2_5.dll ./bin
      cp -v ${DEPLOY_DIR}/direct_deploy/antlr4-cppruntime/bin/antlr4-runtime.dll ./bin

      # Build the test binaries
      cmake ../ -G Ninja -DCMAKE_BUILD_TYPE:STRING="Release" -DCMAKE_C_COMPILER=cl -DANTLR_EXECUTABLE:string=$ANTLR_EXE -DJava_JAVA_EXECUTABLE:string=$JAVA_EXE -DCMAKE_CXX_COMPILER=cl -DMULTI_THREADING:bool=${{ inputs.threading }} -DGUI:bool=true -DCMAKE_INSTALL_PREFIX:PATH=$TEMPD -DBUILD_TESTS:bool=ON
      cmake --build . --config Release

      # Run the tests
      ctest --output-on-failure

  - name: Upload Raw Build Artifacts
    if: ${{ inputs.cacheOnly == 'false' }}
    uses: actions/upload-artifact@v4
    with:
      name: windows-build-artifacts
      path: |
        ${{ github.workspace }}\build
      retention-days: 1

  - name: Upload Qt Artifacts
    if: ${{ inputs.cacheOnly == 'false' }}
    uses: actions/upload-artifact@v4
    with:
      name: windows-qt
      path: |
        ${{ runner.temp }}\qt
      retention-days: 1
