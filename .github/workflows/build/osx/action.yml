name: Build
description: Build on OSX

inputs:
  threading:
    default: true
  osxTargetDeploymentVersion:
    default: 13.3
  cacheOnly:
    type: boolean
    default: false
  qtVersion:
    type: string
    required: true
  antlrVersion:
    type: string
    required: true
  conanHash:
    type: string
    required: true

runs:
  using: "composite"
  steps:

  #
  # Setup / Install Dependencies
  #

  - name: Manage Homebrew Dependencies
    shell: bash
    run: |
      set -ex
      brew update-reset
      brew install gsl

  - name: Get ANTLR
    working-directory: ${{ runner.temp }}
    shell: bash
    run: |
      set -ex
      wget https://www.antlr.org/download/antlr-${{ inputs.antlrVersion }}-complete.jar -Oantlr-${{ inputs.antlrVersion }}-complete.jar

  - name: Install Python Dependencies
    shell: bash
    run: |
      pip3 install conan --break-system-packages

  - name: Install Qt
    uses: jdpurcell/install-qt-action@v5
    with:
      version: '6.11.2'
      host: 'mac'
      target: 'desktop'
      arch: 'clang_64'
      cache: true
      use-naqt: true
      setup-python: false
      modules: 'all'

  #
  # Main Build
  #

  - name: Retrieve Conan Cache
    id: cache-conan
    uses: actions/cache@v4
    with:
      key: osx-${{ runner.arch }}-conan-${{ inputs.conanHash }}
      path: |
        ~/.conan
        ~/.conancache

  - name: Setup Conan Profile
    if: ${{ steps.cache-conan.outputs.cache-hit != 'true' }}
    shell: bash
    run: |
      conan profile detect

  - name: Build
    if: ${{ inputs.cacheOnly == 'false' }}
    shell: bash
    run: |
      set -ex
      git submodule update --init --recursive

      # Setup paths
      export PATH="$(python3 -m site --user-base)/bin:$PATH"
      Qt6_DIR=${{ runner.temp }}/qt/${{ inputs.qtVersion }}/macos/lib/cmake/Qt6
      QT_BASE_DIR=${{ runner.temp }}/qt/${{ inputs.qtVersion }}/macos

      # Find ANTLR4
      ANTLR_EXE="${{ runner.temp }}/antlr-${{ inputs.antlrVersion }}-complete.jar"
      echo "Detected ANTLR exe as [$ANTLR_EXE]"

      # Make sure we have a Java binary path - $JAVA_HOME_21_X64 does not appear to work on Silicon
      if [ "${JAVA_HOME_21_X64}" == "" ]
      then
        JAVA_RUNTIME=`which java`
      else
        JAVA_RUNTIME=${JAVA_HOME_21_X64}/bin/java
      fi
      echo "Java Runtime Executable: ${JAVA_RUNTIME}"

      # Set conan cache location
      conan config home -cc core.download:download_cache="${GITHUB_WORKSPACE}/.conancache"

      # Set minimum deployment target version
      export MACOSX_DEPLOYMENT_TARGET=${{ inputs.osxTargetDeploymentVersion }}

      # Build
      conan install . --deployer=direct_deploy --build=missing
      mkdir -p build && cd build

      cmake -G Ninja -DGUI:bool=true -DMULTI_THREADING:bool=${{ inputs.threading }} -DCONAN_GSL="OFF" -DJava_JAVA_EXECUTABLE:path=${JAVA_RUNTIME} -DANTLR_EXECUTABLE:string=$ANTLR_EXE -DQT_BASE_DIR=$QT_BASE_DIR ../ -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ inputs.osxTargetDeploymentVersion }} -DBUILD_TESTS:bool=ON
      cmake --build . --config Release

      # Move conan-installed deps to the build dir
      mv ../direct_deploy ./

      # Copy over gsl libs so we can ship them with the bundle. Our exe is only linked to two of the four libs present, and this breaks the binary if we don't include them all in the package.
      mkdir gsl
      cp -v $(brew --prefix gsl)/lib/*.dylib ./gsl

  - name: Test
    if: ${{ inputs.cacheOnly == 'false' }}
    shell: bash
    run: |
      set -ex
      cd build

      ctest --output-on-failure

  - name: Upload Raw Build Artifacts
    if: ${{ inputs.cacheOnly == 'false' }}
    uses: actions/upload-artifact@v4
    with:
      name: osx-${{ runner.arch }}-build-artifacts
      path: |
        ${{ github.workspace }}/build
      retention-days: 1

  - name: Upload Qt Artifacts
    if: ${{ inputs.cacheOnly == 'false' }}
    uses: actions/upload-artifact@v4
    with:
      name: osx-${{ runner.arch }}-qt
      path: |
        ${{ runner.temp }}/qt
      retention-days: 1
