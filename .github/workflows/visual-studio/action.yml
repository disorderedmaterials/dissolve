name: Develop MSVC
description: Set up Dissolve CLI and GUI Visual Studio dev environment.

inputs:
    publishType:
        type: choice
        default: 'none'
        options:
            - none
            - continuous
            - release
            - legacy
        
runs:
    using: "composite"
    steps:

    - name: 'Set up MSVC toolchain'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
      
    - name: 'Install dependencies'
      shell: pwsh
      run: | 
        Set-Location ${{ github.workspace }}
        ./develop.ps1 -systemqt

    - name: 'Configure and build with CMake'
      shell: cmd
      run: |
        cmd /c "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxillary/Build/vcvars64.bat"
        cmake --preset CLI-Debug-MSVC
        cmake --build build