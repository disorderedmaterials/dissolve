name: Develop MSVC
description: Set up Dissolve CLI and GUI Visual Studio dev environment.

inputs:
    publishType:
        type: choice
        default: 'none'
        options:
            - none
            - continuous
            - release
            - legacy
        
runs:
    using: "composite"
    steps:

    - name: 'Set up MSVC toolchain'
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: 'Install dependencies'
      shell: pwsh
      run: | 
        Set-Location ${{ github.workspace }}
        ./develop.ps1 -systemqt

    - name: 'Retrieve Conan Cache'
      id: cache-conan
      uses: actions/cache@v4
      with:
          key: windows-conan-${{ env.conanHash }}
          path: |
            ~\.conan
            ~\.conancache

    - name: 'Configure and build with CMake'
      shell: pwsh
      run: | 
        Set-Location ${{ github.workspace }}
        
        # Set conan cache location
        conan config set storage.download_cache="${GITHUB_WORKSPACE}/.conancache"

        # Configure and build
        cmake --preset CLI-Debug-MSVC
        cmake --build build