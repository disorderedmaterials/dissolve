name: Develop MSVC
description: Set up Dissolve CLI and GUI Visual Studio dev environment.

inputs:
    publishType:
        type: choice
        default: 'none'
        options:
            - none
            - continuous
            - release
            - legacy
        
runs:
    using: "composite"
    steps:

    - name: 'Set up MSVC toolchain'
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: 'Install dependencies'
      shell: pwsh
      run: | 
        Set-Location ${{ github.workspace }}
        ./develop.ps1 -systemqt

    - name: 'Configure and build'
      shell: pwsh
      run: | 
        Set-Location ${{ github.workspace }}
        $conanPath = "${{ github.workspace }}\msvc-env\Scripts"
        Write-Output "CONAN PATH ---> $($conanPath)"
        cmake --preset CLI-Debug-MSVC -DCMAKE_PREFIX_PATH=$conanPath
        cmake --build build