name: Develop MSVC
description: Set up Dissolve CLI and GUI Visual Studio dev environment.

inputs:
    publishType:
        type: choice
        default: 'none'
        options:
            - none
            - continuous
            - release
            - legacy
        
runs:
    using: "composite"
    steps:

    - name: 'Set up MSVC toolchain'
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: 'Install dependencies'
      uses: pwsh
      run: | 
        Set-Location ${{ github.workspace }}
        ./develop.ps1 -systemqt

    - name: 'Configure and build dissolve'
      uses: pwsh
      run: | 
        Set-Location ${{ github.workspace }}
        cmake --preset CLI-Debug-MSVC
        mkdir build
        cmake --build build