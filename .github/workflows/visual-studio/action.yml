name: Develop MSVC
description: Set up Dissolve CLI and GUI Visual Studio dev environment.

inputs:
  qtVersion:
    type: string
    required: true
  antlrVersion:
    type: string
    required: true
  changedFiles:
    type: string
    required: true

runs:
  using: composite
  steps:
    - name: 'Check env vars'
      shell: pwsh
      env:
        qtVersion: ${{ inputs.qtVersion }}
        antlrVersion: ${{ inputs.antlrVersion }}
        changedFiles: ${{ inputs.changedFiles }}
      run: |
        Write-Output "Qt version is $env:qtVersion"
        Write-Output "ANTLR version is $env:antlrVersion"
        Write-Output "The files changed in this PR are $env:changedFiles"