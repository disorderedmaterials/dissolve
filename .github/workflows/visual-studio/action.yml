name: Develop MSVC
description: Set up Dissolve CLI and GUI Visual Studio dev environment.

inputs:
    publishType:
        type: choice
        default: 'none'
        options:
            - none
            - continuous
            - release
            - legacy
        
runs:
    using: "composite"
    steps:

    - name: 'Set up MSVC toolchain'
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: 'Install dependencies'
      shell: pwsh
      run: | 
        Set-Location ${{ github.workspace }}
        ./develop.ps1 -systemqt

        Write-Output "Machine env vars:"
        Write-Output "$([Environment]::GetEnvironmentVariable("PATH", [EnvironmentVariableTarget]::Machine))"
        
        Write-Output "Process env vars"        
        Write-Output "$([Environment]::GetEnvironmentVariable("PATH", [EnvironmentVariableTarget]::Process))"

        cmake --preset CLI-Debug-MSVC
        cmake --build build